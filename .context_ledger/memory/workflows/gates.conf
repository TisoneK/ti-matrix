# Gate command registry (project-owned; copy/update after bootstrap)
#
# Commands are executed from the project repository root by
# .context_ledger/core/bin/ledger-gates. Keep secrets out of this file.
#
# mode=hybrid means explicit commands below run first; when a gate has no
# explicit project commands, the helper discovers conventional package.json
# scripts or Python checks. Set mode=explicit to fail when a gate has no
# configured project command.
mode=hybrid

# One command per line: <gate>|<command>
# Gates: checkpoint, pre-commit, integration, exit
#
# Why these are explicit rather than discovered: auto-discovery runs a bare `python`, which does not exist
# on a machine whose only interpreter is the project venv (macOS, 2026-09-23) — the gate failed on the
# environment rather than on the work. Both venv layouts are listed so the same config runs here and on
# Windows; the first that resolves wins and the second is never reached on the platform that has the first.
#
# The fast checks (typecheck, the renderer's folds, the sidecar's suite in 0.3s) gate every commit; the
# engine's suite takes ~56s and is an exit gate instead.
pre-commit|.venv/bin/python -m pytest server/tests -q || .venv/Scripts/python.exe -m pytest server/tests -q
pre-commit|npm --prefix app run typecheck
pre-commit|npm --prefix app run test
integration|.venv/bin/python -m pytest tests server/tests -q || .venv/Scripts/python.exe -m pytest tests server/tests -q
exit|.venv/bin/python -m pytest tests -q || .venv/Scripts/python.exe -m pytest tests -q
exit|npm --prefix app run build
