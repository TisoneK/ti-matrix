name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install -U pip
          python -m pip install -e .[dev] -e server[dev]
      - name: pytest (engine)
        env:
          PYTHONUTF8: "1"   # the cp1252 lesson: the suite carries non-ASCII by design
        run: python -m pytest tests -q
      - name: pytest (sidecar)
        env:
          PYTHONUTF8: "1"
        run: python -m pytest server/tests -q

  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build ti-matrix and ti-matrix-server wheels
        run: |
          python -m pip install -U pip build
          python -m build --wheel .
          python -m build --wheel server
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl

  sidecar:
    needs: [tests]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install -U pip
          python -m pip install -e . -e server[dev]
      - name: build the sidecar bundle
        working-directory: server
        shell: bash
        run: sh scripts/build-sidecar.sh
      - name: smoke the bundled sidecar
        shell: bash
        run: |
          if [ -x ../app/release/sidecar/ti-matrix-server ]; then BIN=../app/release/sidecar/ti-matrix-server; else BIN=../app/release/sidecar/ti-matrix-server.exe; fi
          "$BIN" --port 0 > handshake.txt &
          APP_PID=$!
          sleep 3
          cat handshake.txt
          grep -qE '^TM1 [0-9]+ [0-9a-f]{32}$' handshake.txt
          kill $APP_PID 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.os }}
          path: app/release/sidecar

  app:
    needs: [sidecar]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: sidecar-${{ matrix.os }}
          path: app/release/sidecar
      - name: build and package the desktop app
        working-directory: app
        run: |
          npm install --no-fund --no-audit
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            app/release/*.exe
            app/release/*.dmg
            app/release/*.AppImage
            app/release/*.deb
