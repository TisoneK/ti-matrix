<!doctype html>
<!--
  The boot splash — the first thing on screen, long before the app exists to draw it.

  The window opens here immediately; the sidecar takes seconds to spawn, handshake and become healthy,
  and a dark frame for that whole time reads as "it is broken" when the truth is "it is starting". So
  the splash is drawn as the thing the app sells: a fog-of-war maze. Corridors reveal stage by stage,
  an agent node walks the route as main reports progress, and the exit lights up when the boot lands.
  A boot that fails fails *into* this page — red node, the reason, a way out — not into a modal.

  It is a static file with no build step and no dependencies, because it must work when nothing else
  does. `window.tm` is undefined when opened outside Electron (a browser, a file:// preview), and the
  script treats that as "nobody is telling me anything yet", not as an error.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Ti Matrix</title>
  <style>
    :root {
      color-scheme: dark;
      --void: #05070b;
      --bg: #090c12;
      --plate: #0e1219;
      --line: #1d2532;
      --fg: #e8edf6;
      --fg-2: #9fabc0;
      --fg-3: #6a7688;
      --fg-4: #47505f;
      --ice: #58b6ff;
      --ice-dim: rgba(88, 182, 255, 0.13);
      --ice-line: rgba(88, 182, 255, 0.42);
      --green: #3fd08a;
      --red: #ff6a6a;
      --red-dim: rgba(255, 106, 106, 0.13);
      --mono: ui-monospace, "Cascadia Mono", Consolas, "JetBrains Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg-2);
      font: 13px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      user-select: none;
    }
    main { width: 360px; padding: 24px 0 40px; }
    /* Only the title strip drags the frameless window — never the page, or every click anywhere
       grabs the window and nothing is clickable (the bug this rule replaced). */
    .mark { -webkit-app-region: drag; }
    .mark {
      display: flex; align-items: center; gap: 10px; margin-bottom: 22px;
      color: var(--fg); font-size: 15px; letter-spacing: 0.02em;
      margin-left: -6px; margin-right: -6px; padding: 4px 6px; /* a wider grab strip */
    }
    .mark i {
      width: 22px; height: 22px; border-radius: 5px; flex: none;
      background: var(--ice-dim); border: 1px solid var(--ice-line);
      display: grid; place-items: center;
      color: var(--ice); font: 600 11px var(--mono); font-style: normal;
    }

    /* The boot, as the app sees a run: a maze in fog, walked one decision at a time. */
    #maze {
      display: block; margin: 0 0 14px;
      border: 1px solid var(--line); border-radius: 8px;
      background: var(--void);
    }
    #maze .wall   { fill: none; stroke: var(--line); stroke-width: 1; }
    #maze .floor  { fill: var(--plate); stroke: var(--line); stroke-width: 1; }
    #maze .seen   { fill: rgba(88, 182, 255, 0.05); stroke: var(--line); }
    #maze .walked { fill: var(--ice-dim); stroke: var(--ice-line); }
    #maze .route  { fill: none; stroke: var(--line-2, #27313f); stroke-width: 1.5; }
    #maze .route.walked { stroke: var(--ice-line); }
    #maze .exit-flag { fill: var(--green); opacity: 0; transition: opacity 300ms ease; }
    #maze .exit-flag.on { opacity: 1; }
    #maze .agent { fill: var(--ice); transition: transform 420ms cubic-bezier(.4,0,.2,1); }
    #maze .agent-halo { fill: none; stroke: var(--ice); stroke-opacity: .5;
                        transition: transform 420ms cubic-bezier(.4,0,.2,1);
                        animation: breathe 1.3s ease-in-out infinite; }
    #maze.failed .agent, #maze.failed .agent-halo { fill: var(--red); stroke: var(--red); animation: none; }
    @keyframes breathe { 50% { opacity: 0.25; } }

    ol { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex; align-items: baseline; gap: 10px;
      padding: 5px 2px; color: var(--fg-4); font-size: 12.5px;
      transition: color 160ms ease;
    }
    li .what { flex: 1; }
    li .note { font: 11px var(--mono); color: var(--fg-4); max-width: 150px;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li[data-status="active"] { color: var(--fg); }
    li[data-status="done"] { color: var(--fg-2); }
    li[data-status="done"] .what::after { content: " ✓"; color: var(--green); }
    li[data-status="failed"] { color: var(--red); }

    /* What went wrong, when something did — the detail main attached to the failure. */
    #detail {
      display: none; margin-top: 16px;
      background: var(--red-dim); border: 1px solid rgba(255, 106, 106, 0.4); border-radius: 6px;
      padding: 10px 12px;
      font: 11.5px/1.55 var(--mono); color: var(--fg);
      word-break: break-word; user-select: text; -webkit-app-region: no-drag;
    }
    #detail.on { display: block; }

    #actions { display: none; margin-top: 14px; gap: 8px; }
    #actions.on { display: flex; }
    button {
      font: 12px ui-sans-serif, system-ui, sans-serif; color: var(--fg);
      background: var(--plate); border: 1px solid var(--line); border-radius: 5px;
      padding: 6px 14px; cursor: pointer;
    }
    button:hover { border-color: var(--ice-line); color: var(--ice); }
    button.primary { background: var(--ice-dim); border-color: var(--ice-line); color: var(--ice); }
  </style>
</head>
<body>
  <main>
    <div class="mark"><i>Ti</i><span>Ti Matrix</span></div>
    <svg id="maze" width="360" height="170" viewBox="0 0 360 170" aria-label="the boot, as a maze being explored"></svg>

    <ol id="stages">
      <li data-stage="spawn" data-status="idle"><span class="what">starting the engine</span><span class="note"></span></li>
      <li data-stage="handshake" data-status="idle"><span class="what">handshake</span><span class="note"></span></li>
      <li data-stage="health" data-status="idle"><span class="what">becoming healthy</span><span class="note"></span></li>
      <li data-stage="renderer" data-status="idle"><span class="what">opening the app</span><span class="note"></span></li>
    </ol>

    <div id="detail"></div>
    <div id="actions">
      <button type="button" class="primary" id="retry">try again</button>
      <button type="button" id="quit">quit</button>
    </div>
  </main>

  <script>
    (function () {
      // ── the maze ──────────────────────────────────────────────────────────
      // Six waypoints: the entry, one per boot stage, the exit. The stubs off the route are corridors
      // seen but never walked — the maze-ness, drawn the way the app draws a half-explored world.
      var CELL = 22, PAD = 14;
      var ROUTE = [[1, 5], [2, 4], [3, 4], [4, 2], [6, 2], [8, 1]]; // entry → spawn → handshake → health → renderer → exit
      var STUBS = [[2, 2], [5, 4], [7, 3]];
      var COLS = 10, ROWS = 7;

      var svg = document.getElementById("maze");
      var NS = "http://www.w3.org/2000/svg";
      var el = function (name, attrs) {
        var node = document.createElementNS(NS, name);
        for (var k in attrs) node.setAttribute(k, attrs[k]);
        svg.appendChild(node);
        return node;
      };
      var at = function (c) { return [PAD + c[0] * CELL + CELL / 2, PAD + c[1] * CELL + CELL / 2]; };

      // Fog first: a faint dot lattice over the void, so the dark reads as unexplored, not empty.
      for (var y = 0; y < ROWS; y += 1) {
        for (var x = 0; x < COLS; x += 1) {
          el("circle", { cx: PAD + x * CELL + CELL / 2, cy: PAD + y * CELL + CELL / 2, r: 0.9, fill: "#11161f" });
        }
      }
      // The route as a polyline of nodes — "nodelike" is the point; corridors dress it as a maze.
      var routePts = ROUTE.map(at);
      el("polyline", { class: "route", points: routePts.map(function (p) { return p.join(","); }).join(" ") });

      // Seen-but-unwalked stubs, then the route cells themselves. Cells light in order as stages clear.
      STUBS.forEach(function (c) {
        var p = at(c);
        el("rect", { class: "seen", x: p[0] - CELL / 2 + 2, y: p[1] - CELL / 2 + 2, width: CELL - 4, height: CELL - 4, rx: 3 });
      });
      var cells = ROUTE.map(function (c, i) {
        var p = at(c);
        var r = el("rect", { class: i === 0 ? "walked" : "floor",
                             x: p[0] - CELL / 2 + 2, y: p[1] - CELL / 2 + 2, width: CELL - 4, height: CELL - 4, rx: 3 });
        r.setAttribute("data-i", i);
        return r;
      });
      var exit = ROUTE[ROUTE.length - 1];
      var exitP = at(exit);
      el("path", { class: "exit-flag", d: "M" + (exitP[0] - 2) + " " + (exitP[1] - 5) + " v9 m0 -9 l5 2.5 l-5 2.5", stroke: "#3fd08a", "stroke-width": 1.6, fill: "none" });
      var halo = el("circle", { class: "agent-halo", cx: 0, cy: 0, r: 8.5 });
      var agent = el("circle", { class: "agent", cx: 0, cy: 0, r: 4 });
      var place = function (p) {
        var t = "translate(" + p[0] + " " + p[1] + ")";
        agent.setAttribute("transform", t);
        halo.setAttribute("transform", t);
      };
      place(routePts[0]);

      // ── stages ────────────────────────────────────────────────────────────
      var STAGE_INDEX = { spawn: 1, handshake: 2, health: 3, renderer: 4 };
      var rows = {};
      document.querySelectorAll("li[data-stage]").forEach(function (li) { rows[li.dataset.stage] = li; });

      var cursor = 0;
      function lightUpTo(i, cls) {
        for (var k = 1; k <= i && k < cells.length; k += 1) {
          if (k <= cursor || cls === "walked") cells[k].setAttribute("class", "walked");
        }
        var done = Math.max(cursor, i);
        for (var n = 1; n <= done; n += 1) cells[n].setAttribute("class", "walked");
        cursor = Math.max(cursor, done);
      }

      function render(stage) {
        if (!stage || !stage.id) return;
        var idx = STAGE_INDEX[stage.id];
        var row = rows[stage.id];
        if (row) {
          row.dataset.status = stage.status;
          var note = row.querySelector(".note");
          note.textContent = stage.detail && stage.status !== "failed" ? stage.detail : "";
        }
        if (idx !== undefined) {
          if (stage.status === "failed") {
            svg.classList.add("failed");
            place(routePts[idx]);
            lightUpTo(idx - 1, "walked");
          } else if (stage.status === "active") {
            lightUpTo(idx - 1, "walked");
            place(routePts[idx]);
          } else if (stage.status === "done") {
            lightUpTo(idx, "walked");
            if (idx === ROUTE.length - 1) svg.querySelector(".exit-flag").classList.add("on");
          }
        }
        // A failure is the end of the line: show the detail, offer the way out.
        if (stage.status === "failed") {
          var detail = document.getElementById("detail");
          detail.textContent = stage.detail || "something went wrong starting the app.";
          detail.classList.add("on");
          document.getElementById("actions").classList.add("on");
        }
      }

      document.getElementById("retry").addEventListener("click", function () {
        if (window.tm && window.tm.relaunch) window.tm.relaunch();
      });
      document.getElementById("quit").addEventListener("click", function () {
        if (window.tm && window.tm.window) window.tm.window.close();
        else window.close();
      });

      // Outside Electron there is nothing to listen to; the maze simply waits at its entry node.
      if (window.tm && window.tm.onBootStage) {
        window.tm.onBootStage(render);
        // A stage reported before this page finished loading would otherwise be lost — main keeps the
        // log, so replay it and then live updates take over.
        window.tm.bootLog().then(function (log) { (log || []).forEach(render); });
      }
    })();
  </script>
</body>
</html>
